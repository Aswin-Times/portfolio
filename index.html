<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A personal portfolio told as a heist plan."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <title>Aswin R | The Plan</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to the operation</a>
    <div class="site-loader" aria-hidden="true">
      <div class="loader-mark"></div>
      <span class="loader-label">PREPARING THE PLAN 0%</span>
    </div>
    <div class="film-grain" aria-hidden="true"></div>
    <div class="edge-vignette" aria-hidden="true"></div>
    <div class="laser-tripwire" aria-hidden="true"><span></span></div>
    <aside class="cctv-overlay" aria-label="Surveillance status">
      <span class="cctv-overlay__rec"><i></i> REC</span>
      <span id="cctv-camera">CAM 03</span>
      <time id="cctv-time">00:00:00</time>
      <span id="cctv-location">OPERATION FLOOR</span>
    </aside>
    <aside class="heist-log" aria-live="polite">
      <span>HEIST LOG</span>
      <p id="heist-log-text"></p>
    </aside>
    <div class="laser-cursor" aria-hidden="true">
      <span class="laser-cursor__dot"></span>
    </div>
    <div class="hud" aria-live="polite">
      <div class="hud__phase" id="phase-label">PHASE 01 / 07</div>
      <div class="hud__timer" id="countdown">00:06:00</div>
      <div class="hud__rule"><span id="scroll-progress"></span></div>
    </div>
    <header class="site-header">
      <a class="wordmark magnetic" href="#the-plan" aria-label="Back to the plan">
        <span class="wordmark__mark">A/R</span>
        <span id="wordmark-name">ASWIN R</span>
      </a>
      <nav class="site-controls" aria-label="Site controls">
        <button class="rules-toggle magnetic" id="rules-toggle" type="button" aria-expanded="false" aria-controls="rules-menu">
          THE PROFESSOR'S RULES
        </button>
        <button class="sound-toggle magnetic" id="sound-toggle" type="button" aria-pressed="false">
          SOUND OFF
        </button>
      </nav>
    </header>
    <div class="availability-tag" id="availability-tag">AVAILABLE FOR WORK: THE VAULT IS OPEN</div>
    <aside class="rules-overlay" id="rules-menu" aria-hidden="true" aria-label="The Professor's Rules">
      <button class="rules-close magnetic" id="rules-close" type="button" aria-label="Close rules">CLOSE</button>
      <p class="rules-overlay__kicker">THE PROFESSOR'S RULES</p>
      <ol class="rules-list" id="rules-list"></ol>
    </aside>
    <main id="main-content"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
